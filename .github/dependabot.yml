# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod" # Dependabot will update Go modules
    directory: "/" # Location of the go.mod file
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    ignore:
      # sentry-go/echo >= 0.45.0 requires Echo v5; bean is still on Echo v4.
      # Remove this once bean migrates to Echo v5.
      - dependency-name: "github.com/getsentry/sentry-go/echo"
        versions: [">= 0.45.0"]
