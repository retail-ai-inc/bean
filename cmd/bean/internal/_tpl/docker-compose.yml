services:
  {{.ServiceName}}:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    tty: true
    hostname: {{.ServiceName}}
    container_name: {{.ServiceName}}
    # Live reload: rebuilds and restarts `app start` on changes (see .air.toml).
    command: air
    volumes:
      - .:/app:rw
      - ~/go/pkg:/go/pkg
    security_opt:
      - "seccomp:unconfined"
    ports:
      - {{.AppPort}}:{{.AppPort}}
      - 40000:40000
    networks:
      - backend

networks:
  backend:
    external: true
